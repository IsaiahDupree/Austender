[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configure logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Add markers
markers =
    unit: unit tests
    integration: integration tests
    slow: tests that take longer to run
    scraper: tests for the scraper components
    api: tests for the API components
    analyzer: tests for the document analyzer
    db: tests that interact with the database

# Set timeout for tests (in seconds)
timeout = 60
